# GitHub Actions — Release workflow
#
# Triggers when you push a version tag: git tag v1.2.0 && git push --tags
#
# What it does:
#   1. Checks out the repo.
#   2. Installs dpkg-deb (already on Ubuntu runners).
#   3. Runs packaging/build-deb.sh with the tag version.
#   4. Creates a GitHub Release and uploads seatsplit_<VERSION>_all.deb as an asset.
#
# Versioning convention:
#   Tag format:  vMAJOR.MINOR.PATCH   (e.g. v1.2.0)
#   .deb name:   seatsplit_MAJOR.MINOR.PATCH_all.deb
#
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"   # e.g. v1.2.0

permissions:
  contents: write    # needed to create/upload the GitHub Release

jobs:
  build-and-release:
    name: Build .deb and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        run: |
          chmod +x packaging/build-deb.sh
          ./packaging/build-deb.sh "${{ steps.ver.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SeatSplit ${{ github.ref_name }}"
          body: |
            ## What's new
            <!-- Fill in release notes here, or use GitHub's auto-generate feature -->

            ## Installation
            ```bash
            # Download the .deb and install:
            sudo apt install ./seatsplit_${{ steps.ver.outputs.version }}_all.deb

            # Or install from source:
            sudo ./packaging/install.sh
            ```

            ### Dependencies
            ```bash
            sudo apt install python3-gi python3-gi-cairo gir1.2-gtk-3.0 policykit-1
            ```
          files: "seatsplit_${{ steps.ver.outputs.version }}_all.deb"
          draft: false
          prerelease: false
