# GitHub Actions — Release workflow
#
# Triggers when you push a version tag: git tag v1.2.0 && git push --tags
#
# What it does:
#   1. Checks out the full git history.
#   2. Extracts commit messages since the previous tag for the changelog.
#   3. Runs packaging/build-deb.sh to build the .deb.
#   4. Creates a GitHub Release with changelog + install instructions,
#      and uploads seatsplit_<VERSION>_all.deb as an asset.
#
# Versioning convention:
#   Tag format:  vMAJOR.MINOR.PATCH   (e.g. v1.2.0)
#   .deb name:   seatsplit_MAJOR.MINOR.PATCH_all.deb
#
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"   # e.g. v1.2.0

permissions:
  contents: write    # needed to create/upload the GitHub Release

jobs:
  build-and-release:
    name: Build .deb and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # need full history to compare tags

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog from commits since last tag
        id: changelog
        run: |
          # Find the previous tag (the one before this one)
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n1)

          if [ -z "$PREV_TAG" ]; then
            # First ever release — list all commits
            LOG=$(git log --pretty=format:"- %s" HEAD)
          else
            LOG=$(git log --pretty=format:"- %s" "${PREV_TAG}..HEAD")
          fi

          # Write to output (multiline safe)
          {
            echo "log<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build .deb
        run: |
          chmod +x packaging/build-deb.sh
          ./packaging/build-deb.sh "${{ steps.ver.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SeatSplit ${{ github.ref_name }}"
          body: |
            ## What's new
            ${{ steps.changelog.outputs.log }}

            ---

            ## Install

            ### Debian / Ubuntu / Linux Mint (.deb)
            ```bash
            sudo apt install python3-gi python3-gi-cairo gir1.2-gtk-3.0 policykit-1
            wget https://github.com/hyphen04/SeatSplit/releases/download/${{ github.ref_name }}/seatsplit_${{ steps.ver.outputs.version }}_all.deb
            sudo apt install ./seatsplit_${{ steps.ver.outputs.version }}_all.deb
            ```

            ### From source
            ```bash
            git clone https://github.com/hyphen04/SeatSplit.git
            cd SeatSplit
            sudo ./packaging/install.sh
            ```
          files: "seatsplit_${{ steps.ver.outputs.version }}_all.deb"
          draft: false
          prerelease: false
